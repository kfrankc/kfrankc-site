# Site settings
baseurl = "https://kfrankc.com"
title = "Frank Chen"
languageCode = "en-us"
sectionPagesMenu = "main"
googleAnalytics = "G-366849346"

[params]
	name = "Frank Chen"
	title = "Frank Chen | Creativity 🤝 Engineering"
	description = "Product work on AI & personalization at Tubi. Previously Typeface, Twitter, & Microsoft. Drawing, photos, and writing"
	email = "kfrankc@uw.edu"
	author = "kfrankc"
	copyrightname = "Frank Chen"
	images = ["card.png"]

[taxonomies]
  series = "series"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.parser]
      attribute = true
      autoHeadingID = true
      autoHeadingIDType = "github"
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = false
      xhtml = false
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "rainbow_dash"
    tabWidth = 4