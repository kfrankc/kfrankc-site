{{ define "main" }}
<div class="drawings-page">
  <!-- Size filter options -->
  <nav class="gallery-options">
    <div class="size-buttons">
      <button data-size="50%">small</button>
      <button class="active" data-size="100%">medium</button>
      <button data-size="150%">large</button>
    </div>
  </nav>

  <!-- Drawings grid -->
  <section class="gallery-grid gallery-hidden" id="drawings-grid" data-size-grid="100%">
    {{ range $index, $artwork := .Site.Data.artworks.artworks }}
    <div class="gallery-item" data-index="{{ add $index 1 }}" data-title="{{ $artwork.title }}" data-mediums="{{ $artwork.mediums }}" data-date="{{ $artwork.date }}">
      <img class="gallery-image drawings-image" src="/{{ $artwork.image }}" alt="{{ $artwork.title }}" width="{{ $artwork.width }}" height="{{ $artwork.height }}" style="aspect-ratio: {{ $artwork.width }} / {{ $artwork.height }};">
    </div>
    {{ end }}
  </section>

  <!-- Polaroid lightbox overlay -->
  <div class="polaroid-overlay" id="polaroid-overlay">
    <div class="polaroid" id="polaroid">
      <div class="polaroid-image-container">
        <img class="polaroid-image" id="polaroid-image" src="" alt="">
      </div>
      <div class="polaroid-info" id="polaroid-info"></div>
    </div>
  </div>
</div>

<!-- GSAP and Flip plugin -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>

<script>
  gsap.registerPlugin(Flip);

  // Fade-in images with stagger effect
  function setupImageFadeIn() {
    const images = document.querySelectorAll('.gallery-image');
    const staggerDelay = 30;
    
    images.forEach((img, index) => {
      function fadeIn() {
        setTimeout(() => {
          img.classList.add('loaded');
        }, index * staggerDelay);
      }
      
      if (img.complete) {
        fadeIn();
      } else {
        img.addEventListener('load', fadeIn);
        img.addEventListener('error', fadeIn);
      }
    });
  }
  
  // Show grid after styles are computed (prevents size flash)
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const grid = document.getElementById('drawings-grid');
      grid.classList.remove('gallery-hidden');
      setupImageFadeIn();
    });
  });

  // DOM elements
  const drawingsGrid = document.getElementById('drawings-grid');
  const allDrawingsItems = document.querySelectorAll('.gallery-item');
  const sizeButtons = document.querySelectorAll('.size-buttons button');

  // State
  let animated = false;
  let currentGridSize = drawingsGrid.dataset.sizeGrid || "100%";
  let isPolaroidOpen = false;

  // Add click handlers to size buttons
  sizeButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      // Prevent interaction if animation is running
      if (animated || isPolaroidOpen) return;

      // Get target size from data attribute
      const targetSize = btn.dataset.size;

      // If already at this size, do nothing
      if (targetSize === currentGridSize) return;

      // Lock animation state
      animated = true;

      // Capture current state of all grid items
      const state = Flip.getState(allDrawingsItems);

      // Update grid size
      drawingsGrid.dataset.sizeGrid = targetSize;
      currentGridSize = targetSize;

      // Update active button state
      sizeButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');

      const flipDuration = 1;
      const staggerAmount = 0.3;
      const totalFlipDuration = flipDuration + staggerAmount;

      // Store current scroll position and container height to prevent jumping
      const scrollY = window.scrollY;
      const containerHeight = drawingsGrid.offsetHeight;
      drawingsGrid.style.minHeight = containerHeight + 'px';

      // Animate elements from the previous state to the new layout
      Flip.from(state, {
        absolute: true,
        duration: flipDuration,
        ease: "expo.inOut",
        onComplete: () => {
          // Reset min-height after animation
          drawingsGrid.style.minHeight = '';
          animated = false;
        },
        stagger: {
          amount: staggerAmount,
          from: "random",
        },
      }).fromTo(
        drawingsGrid,
        {
          filter: "blur(0px)",
        },
        {
          duration: totalFlipDuration,
          keyframes: [
            {
              filter: "blur(10px)",
              duration: totalFlipDuration * 0.5,
              ease: "power2.in",
            },
            {
              filter: "blur(0px)",
              duration: totalFlipDuration * 0.5,
              ease: "power2",
              delay: 0.5,
            },
          ],
        },
        0
      );
    });
  });

  // =============================================
  // Polaroid Lightbox
  // =============================================
  
  const polaroidOverlay = document.getElementById('polaroid-overlay');
  const polaroid = document.getElementById('polaroid');
  const polaroidImage = document.getElementById('polaroid-image');
  const polaroidInfo = document.getElementById('polaroid-info');
  
  let currentImageRect = null;
  let scrollStart = 0;

  // Click handler for drawings items
  allDrawingsItems.forEach((item) => {
    item.addEventListener('click', (e) => {
      if (animated || isPolaroidOpen) return;
      
      const img = item.querySelector('.gallery-image');
      const title = item.dataset.title;
      const mediums = item.dataset.mediums;
      const date = item.dataset.date;
      
      // Store original position
      currentImageRect = img.getBoundingClientRect();
      scrollStart = window.scrollY;
      
      // Set polaroid content
      polaroidImage.src = img.src;
      polaroidImage.alt = img.alt;
      polaroidImage.style.opacity = '1';
      
      // Set info text: title • mediums • date
      const infoParts = [title, mediums, date].filter(Boolean);
      if (infoParts.length > 0) {
        polaroidInfo.textContent = infoParts.join(' • ');
        polaroidInfo.style.display = 'block';
      } else {
        polaroidInfo.style.display = 'none';
      }
      
      // Open polaroid
      openPolaroid();
    });
  });

  function openPolaroid() {
    isPolaroidOpen = true;
    
    // Kill any existing animations on polaroid
    gsap.killTweensOf(polaroid);
    gsap.killTweensOf(polaroidOverlay);
    
    // Clear any inline opacity from GSAP (let CSS handle opacity)
    polaroid.style.opacity = '';
    
    // Set initial state BEFORE showing overlay
    gsap.set(polaroidOverlay, { opacity: 0 });
    gsap.set(polaroid, { scale: 0.85 });
    
    // Now show overlay (CSS transition handles polaroid opacity)
    polaroidOverlay.classList.add('active');
    
    // Animate overlay in
    gsap.to(polaroidOverlay, { 
      opacity: 1, 
      duration: 0.3, 
      ease: "power2.out" 
    });
    
    // Animate polaroid scale only (CSS handles opacity)
    gsap.to(polaroid, {
      scale: 1,
      duration: 0.45,
      ease: "power2.out",
    });
    
    // Add mouse move listener for 3D tilt
    document.addEventListener('mousemove', handleMouseMove);
    
    // Add scroll listener to close
    window.addEventListener('scroll', handleScroll);
  }

  function closePolaroid() {
    if (!isPolaroidOpen) return;
    
    isPolaroidOpen = false;
    
    // Remove listeners
    document.removeEventListener('mousemove', handleMouseMove);
    window.removeEventListener('scroll', handleScroll);
    
    // Animate out polaroid scale only
    gsap.to(polaroid, {
      scale: 0.85,
      rotateX: 0,
      rotateY: 0,
      duration: 0.3,
      ease: "power3.in",
    });
    
    // Animate overlay out
    gsap.to(polaroidOverlay, {
      opacity: 0,
      duration: 0.3,
      ease: "power3.in",
      onComplete: () => {
        polaroidOverlay.classList.remove('active');
        // Reset styles after overlay is hidden
        gsap.set(polaroidOverlay, { opacity: '' });
        gsap.set(polaroid, { rotateX: 0, rotateY: 0, scale: 1 });
        polaroid.style.opacity = '';
      }
    });
  }

  const tiltStrength = 15;

  // Get or create shine element
  let shine = null;
  function getShine() {
    if (!shine) {
      shine = polaroid.querySelector('.polaroid-shine');
      if (!shine) {
        shine = document.createElement('div');
        shine.className = 'polaroid-shine';
        polaroid.appendChild(shine);
      }
    }
    return shine;
  }

  // Apply tilt and shine effect
  function applyPolaroidTilt(clientX, clientY) {
    // Kill any running reset animation
    gsap.killTweensOf(polaroid);
    gsap.killTweensOf(getShine());
    
    const rect = polaroid.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const percentX = (clientX - centerX) / (rect.width / 2);
    const percentY = (clientY - centerY) / (rect.height / 2);

    const tiltX = -percentY * tiltStrength;
    const tiltY = percentX * tiltStrength;

    // Apply transform with perspective, tilt, and slight scale
    polaroid.style.transform = `
      perspective(1000px)
      rotateX(${tiltX}deg)
      rotateY(${tiltY}deg)
      scale(1.02)
    `;

    // Update shine effect position
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const xPercent = (x / rect.width) * 100;
    const yPercent = (y / rect.height) * 100;
    
    const shineEl = getShine();
    shineEl.style.background = `radial-gradient(circle at ${xPercent}% ${yPercent}%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.15) 40%, transparent 80%)`;
    shineEl.style.opacity = '1';
  }

  function resetPolaroidTilt() {
    gsap.to(polaroid, {
      rotateX: 0,
      rotateY: 0,
      scale: 1,
      duration: 0.5,
      ease: "power2.out",
      onComplete: () => {
        polaroid.style.transform = '';
      }
    });
    const shineEl = getShine();
    gsap.to(shineEl, {
      opacity: 0,
      duration: 0.4,
      ease: "power2.out"
    });
  }

  // Tilt and shine effect - only when mouse is on polaroid
  function handleMouseMove(e) {
    if (!isPolaroidOpen) return;
    
    const rect = polaroid.getBoundingClientRect();
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    
    // Check if mouse is over the polaroid
    const isOverPolaroid = (
      mouseX >= rect.left &&
      mouseX <= rect.right &&
      mouseY >= rect.top &&
      mouseY <= rect.bottom
    );
    
    if (isOverPolaroid) {
      applyPolaroidTilt(mouseX, mouseY);
    } else {
      resetPolaroidTilt();
    }
  }

  // Close on scroll
  function handleScroll() {
    const scrollDiff = Math.abs(window.scrollY - scrollStart);
    if (scrollDiff > 50) {
      closePolaroid();
    }
  }

  // Close when clicking outside polaroid
  polaroidOverlay.addEventListener('click', (e) => {
    if (e.target === polaroidOverlay) {
      closePolaroid();
    }
  });

  // Close on escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isPolaroidOpen) {
      closePolaroid();
    }
  });
</script>
{{ end }}
