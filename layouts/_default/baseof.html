<!DOCTYPE html>
<html>
    {{- partial "head.html" . -}}
    {{ if eq .Type "home" }}
        {{- partial "home.html" . -}} 
    {{ end }}
    <body{{ if or (eq .Section "gallery") (eq .Section "drawings") }} class="page-gallery"{{ end }}>
        {{- partial "header.html" . -}}
        <div id="content">
        {{- block "main" . }}{{- end }}
        </div>
        {{ if eq .Type "home" }}
            {{- partial "footer.html" . -}}
            <script src="/js/gaze-tracker.js?v=1.0.2"></script>
        {{ end }}
    </body>
</html>
