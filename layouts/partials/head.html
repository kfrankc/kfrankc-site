<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ if .IsHome }}{{ with .Title }}{{ . }}{{ else }}{{ .Site.Params.name | default "Frank Chen" }}{{ end }}{{ else }}{{ with .Title }}{{ . }} · {{ end }}{{ .Site.Params.name | default "Frank Chen" }}{{ end }}</title>
	<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}" />
	<meta name="keywords" content="{{ with .Site.Params.keywords }}{{ . }}{{ end }}" />
	<meta name="author" content="{{ with .Site.Params.author }}{{ . }}{{ end }}" />

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="/css/main.css?v=1.3.4" />
	<link rel="stylesheet" type="text/css" href="/css/component.css?v=0.1.2" />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;700&display=swap" rel="stylesheet">

	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
	<meta name="msapplication-TileColor" content="#2b5797">
	<meta name="theme-color" content="#F7F7F4">
	{{ template "_internal/opengraph.html" . }}
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	{{ template "_internal/google_analytics.html" . }}
	{{ template "_internal/twitter_cards.html" . }}
</head>
